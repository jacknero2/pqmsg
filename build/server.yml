# electron-builder config — pqmsg SERVER control-panel app (operator only)
# build:  npm run dist:server
appId: com.jacknero.pqmsg.server
productName: pqmsg Server
copyright: © 2026 jacknero2
directories:
  output: dist/server
  buildResources: build
extraMetadata:
  main: server/app/main.js
  name: pqmsg-server
  productName: pqmsg Server
files:
  - "server/**/*"
  - "shared/**/*"
  - "package.json"
  - "!**/*.md"
  - "!client/**"
  - "!build/**"
  - "!dist/**"
  - "!docs/**"
  - "!scripts/**"
  - "!resources/**"
  - "!.github/**"
  - "!server-data/**"
# CI drops the matching cloudflared binary into ./resources before packaging;
# it lands in the app's resources dir and is spawned by server/app/tunnel.js
extraResources:
  - from: resources
    to: .
    filter: ["cloudflared", "cloudflared.exe"]
npmRebuild: false
electronLanguages: ["en"]
artifactName: ${name}-${version}-${os}-${arch}.${ext}
publish: null

mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  identity: null
  gatekeeperAssess: false
  target:
    - target: dmg
      arch: [arm64, x64]
dmg:
  writeUpdateInfo: false

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-setup.${ext}

linux:
  icon: build/icon.png
  category: Network
  maintainer: jacknero2
  target: [AppImage, deb]
