name: build & release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {} # manual test builds (artifacts only, no release)

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run e2e
      - run: npm run e2e:2fa
      - run: npm run e2e:network
      - run: npm run e2e:admin

      # no GH_TOKEN here on purpose — electron-builder must NOT auto-publish;
      # the single "Publish to GitHub Release" step below is the only uploader
      - name: Build client
        run: npm run dist

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          # depth 2 keeps dist/<app>/<installer> but skips dist/<app>/*-unpacked/*.exe
          find dist -mindepth 2 -maxdepth 2 -type f \
            \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: pqmsg-${{ matrix.os }}
          path: out/*

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: false
          generate_release_notes: true
